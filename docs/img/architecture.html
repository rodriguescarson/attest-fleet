<meta charset="utf-8">
<title>Attest Fleet — architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#080c0d;}
  svg{display:block}
  .t{font-family:"Hanken Grotesk",system-ui,sans-serif}
  .m{font-family:"JetBrains Mono",ui-monospace,monospace}
</style>

<svg width="1450" height="752" viewBox="0 0 1640 850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c7573"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1640" height="850" fill="#080c0d"/>

  <!-- ===== header ===== -->
  <text class="t" x="56" y="56" fill="#eaf3f1" font-size="31" font-weight="700" letter-spacing="-0.4">Attest Fleet — architecture</text>
  <text class="m" x="56" y="85" fill="#7f9694" font-size="14.5">Governed multi-agent fleet on <tspan fill="#22d3ee">Gemini 3.7 Flash</tspan> + <tspan fill="#22d3ee">ADK</tspan> + <tspan fill="#22d3ee">Cloud Run</tspan> + <tspan fill="#22d3ee">Firestore</tspan>. Every &#8220;done&#8221; is a <tspan fill="#eaf3f1">claim</tspan>, checked against the system of record.</text>

  <!-- ===== BAND 1 : EXECUTE ===== -->
  <text class="m" x="140" y="142" fill="#4d6360" font-size="12.5" letter-spacing="1.6">1 · EXECUTE</text>

  <!-- ticket -->
  <rect x="140" y="160" width="165" height="76" rx="9" fill="#101718" stroke="#243133"/>
  <text class="t" x="222" y="190" fill="#eaf3f1" font-size="14.5" font-weight="600" text-anchor="middle">Ticket trigger</text>
  <text class="m" x="222" y="211" fill="#7f9694" font-size="11.5" text-anchor="middle">webhook · Pub/Sub</text>
  <text class="m" x="222" y="227" fill="#4d6360" font-size="10.5" text-anchor="middle">not a chat box</text>

  <!-- vision -->
  <rect x="333" y="160" width="165" height="76" rx="9" fill="#0d1a1e" stroke="#1c4a55"/>
  <text class="t" x="415" y="190" fill="#eaf3f1" font-size="14.5" font-weight="600" text-anchor="middle">Vision reader</text>
  <text class="m" x="415" y="211" fill="#22d3ee" font-size="11.5" text-anchor="middle">Gemini 3.7</text>
  <text class="m" x="415" y="227" fill="#4d6360" font-size="10.5" text-anchor="middle">reads attachment</text>

  <!-- controller -->
  <rect x="526" y="160" width="175" height="76" rx="9" fill="#0d1a1e" stroke="#1c4a55"/>
  <text class="t" x="613" y="190" fill="#eaf3f1" font-size="14.5" font-weight="600" text-anchor="middle">fleet_controller</text>
  <text class="m" x="613" y="211" fill="#22d3ee" font-size="11.5" text-anchor="middle">Gemini 3.7</text>
  <text class="m" x="613" y="227" fill="#4d6360" font-size="10.5" text-anchor="middle">resolve + decompose</text>

  <!-- workers -->
  <rect x="729" y="160" width="195" height="76" rx="9" fill="#0d1a1e" stroke="#1c4a55"/>
  <text class="t" x="826" y="188" fill="#eaf3f1" font-size="14.5" font-weight="600" text-anchor="middle">billing_agent · account_agent</text>
  <text class="m" x="826" y="209" fill="#22d3ee" font-size="11.5" text-anchor="middle">Gemini 3.7</text>
  <text class="m" x="826" y="226" fill="#4d6360" font-size="10.5" text-anchor="middle">one task each · scoped tools</text>

  <!-- policy gate -->
  <rect x="952" y="160" width="185" height="76" rx="9" fill="#1a1408" stroke="#5c4610"/>
  <text class="t" x="1044" y="186" fill="#fbbf24" font-size="14.5" font-weight="600" text-anchor="middle">Policy gate</text>
  <text class="m" x="1044" y="206" fill="#a3a3a3" font-size="10.5" text-anchor="middle">kill switch · state gate</text>
  <text class="m" x="1044" y="222" fill="#a3a3a3" font-size="10.5" text-anchor="middle">human approval</text>
  <text class="m" x="1044" y="150" fill="#5c4610" font-size="10" text-anchor="middle">before every mutating call</text>

  <!-- tools -->
  <rect x="1185" y="160" width="140" height="76" rx="9" fill="#101718" stroke="#243133"/>
  <text class="t" x="1255" y="196" fill="#eaf3f1" font-size="14.5" font-weight="600" text-anchor="middle">Tools</text>
  <text class="m" x="1255" y="216" fill="#7f9694" font-size="11" text-anchor="middle">mutate state</text>

  <!-- firestore -->
  <rect x="1373" y="160" width="185" height="76" rx="9" fill="#101718" stroke="#3f5a3f"/>
  <text class="t" x="1465" y="190" fill="#eaf3f1" font-size="14.5" font-weight="600" text-anchor="middle">Firestore</text>
  <text class="m" x="1465" y="211" fill="#7f9694" font-size="11.5" text-anchor="middle">system of record</text>
  <text class="m" x="1465" y="227" fill="#4d6360" font-size="10.5" text-anchor="middle">+ evidence store</text>

  <!-- band 1 arrows -->
  <line x1="305" y1="198" x2="326" y2="198" stroke="#5c7573" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="498" y1="198" x2="519" y2="198" stroke="#5c7573" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="701" y1="198" x2="722" y2="198" stroke="#5c7573" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="924" y1="198" x2="945" y2="198" stroke="#5c7573" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="1137" y1="198" x2="1178" y2="198" stroke="#5c7573" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="1325" y1="198" x2="1366" y2="198" stroke="#5c7573" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- blocked branch off the gate -->
  <path d="M1044,236 L1044,272 L1220,272" fill="none" stroke="#5c4610" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text class="m" x="1232" y="276" fill="#fbbf24" font-size="11">blocked → reports &#8220;blocked&#8221;, nothing mutates</text>

  <!-- ===== BAND 2 : VERIFY ===== -->
  <text class="m" x="140" y="352" fill="#4d6360" font-size="12.5" letter-spacing="1.6">2 · VERIFY</text>
  <text class="t" x="140" y="379" fill="#8fa6a3" font-size="15">The reconciliation every other agent stack skips.</text>

  <!-- claim -->
  <rect x="716" y="410" width="220" height="70" rx="9" fill="#141018" stroke="#3b2f52"/>
  <text class="t" x="826" y="440" fill="#eaf3f1" font-size="14" font-weight="600" text-anchor="middle">Worker&#8217;s claim</text>
  <text class="m" x="826" y="462" fill="#7f9694" font-size="11" text-anchor="middle">&#8220;done&#8221; + self-reported confidence</text>

  <!-- state -->
  <rect x="1355" y="410" width="220" height="70" rx="9" fill="#0f1613" stroke="#3f5a3f"/>
  <text class="t" x="1465" y="440" fill="#eaf3f1" font-size="14" font-weight="600" text-anchor="middle">Actual state</text>
  <text class="m" x="1465" y="462" fill="#7f9694" font-size="11" text-anchor="middle">read back from Firestore</text>

  <!-- feeds into claim / state -->
  <path d="M826,236 L826,403" fill="none" stroke="#5c7573" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M1465,236 L1465,403" fill="none" stroke="#5c7573" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- gemma auditor -->
  <rect x="716" y="530" width="220" height="66" rx="9" fill="#150f22" stroke="#4c3a75"/>
  <text class="t" x="826" y="558" fill="#c4b5fd" font-size="14" font-weight="600" text-anchor="middle">Auditor · Gemma 4</text>
  <text class="m" x="826" y="579" fill="#7f9694" font-size="10.5" text-anchor="middle">different model family · last resort</text>

  <!-- verifier -->
  <rect x="1055" y="510" width="230" height="106" rx="10" fill="#0c1a15" stroke="#34d399" stroke-width="1.6"/>
  <text class="t" x="1170" y="546" fill="#34d399" font-size="17" font-weight="700" text-anchor="middle">Verifier</text>
  <text class="m" x="1170" y="571" fill="#cbd5d3" font-size="11" text-anchor="middle">checks post-conditions</text>
  <text class="m" x="1170" y="590" fill="#7f9694" font-size="10.5" text-anchor="middle">deterministic first,</text>
  <text class="m" x="1170" y="605" fill="#7f9694" font-size="10.5" text-anchor="middle">model only if needed</text>

  <!-- converge arrows -->
  <path d="M900,480 C980,480 1000,505 1055,530" fill="none" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#ap)"/>
  <path d="M1400,480 C1320,480 1300,505 1285,530" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="936" y1="563" x2="1048" y2="563" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ap)"/>

  <!-- outcomes -->
  <rect x="1355" y="512" width="220" height="46" rx="8" fill="#0c1a15" stroke="#34d399"/>
  <text class="t" x="1465" y="541" fill="#34d399" font-size="14" font-weight="600" text-anchor="middle">match → VERIFIED</text>

  <rect x="1355" y="576" width="220" height="46" rx="8" fill="#1c0f14" stroke="#fb7185"/>
  <text class="t" x="1465" y="605" fill="#fb7185" font-size="14" font-weight="600" text-anchor="middle">mismatch → SILENT FAILURE</text>

  <line x1="1285" y1="535" x2="1348" y2="535" stroke="#34d399" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="1285" y1="592" x2="1348" y2="592" stroke="#fb7185" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ===== BAND 3 : GOVERN + LEARN ===== -->
  <text class="m" x="140" y="700" fill="#4d6360" font-size="12.5" letter-spacing="1.6">3 · MEASURE &amp; LEARN</text>

  <!-- playbook -->
  <rect x="716" y="722" width="220" height="76" rx="9" fill="#150f22" stroke="#4c3a75"/>
  <text class="t" x="826" y="752" fill="#c4b5fd" font-size="14" font-weight="600" text-anchor="middle">Playbook lesson</text>
  <text class="m" x="826" y="773" fill="#7f9694" font-size="10.5" text-anchor="middle">injected into that worker&#8217;s</text>
  <text class="m" x="826" y="788" fill="#7f9694" font-size="10.5" text-anchor="middle">next run — no prompt edit</text>

  <!-- metrics -->
  <rect x="1055" y="722" width="230" height="76" rx="9" fill="#101718" stroke="#243133"/>
  <text class="t" x="1170" y="750" fill="#eaf3f1" font-size="14" font-weight="600" text-anchor="middle">Metrics</text>
  <text class="m" x="1170" y="770" fill="#7f9694" font-size="10.5" text-anchor="middle">reported vs verified · Brier / ECE</text>
  <text class="m" x="1170" y="786" fill="#7f9694" font-size="10.5" text-anchor="middle">risk-coverage · escalation threshold</text>

  <!-- dashboard -->
  <rect x="1355" y="722" width="220" height="76" rx="9" fill="#0d1a1e" stroke="#1c4a55"/>
  <text class="t" x="1465" y="752" fill="#eaf3f1" font-size="14" font-weight="600" text-anchor="middle">Operator dashboard</text>
  <text class="m" x="1465" y="773" fill="#22d3ee" font-size="11" text-anchor="middle">Cloud Run</text>
  <text class="m" x="1465" y="789" fill="#4d6360" font-size="10.5" text-anchor="middle">evidence trail per run</text>

  <!-- silent failure feeds playbook + metrics -->
  <path d="M1465,622 L1465,660 L826,660 L826,715" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M1170,660 L1170,715" fill="none" stroke="#5c7573" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1285" y1="760" x2="1348" y2="760" stroke="#5c7573" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- feedback loop: playbook back up into workers, routed down the left channel -->
  <path d="M716,760 L92,760 L92,128 L826,128 L826,153" fill="none" stroke="#4c3a75" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ap)"/>

  <!-- ===== info blocks, left column ===== -->
  <text class="m" x="130" y="424" fill="#4d6360" font-size="11.5" letter-spacing="1.4">FAILURE TOLERANCE</text>
  <text class="m" x="130" y="448" fill="#a3b8b5" font-size="12">model fallback cascade: 3.7 &#8594; 3.6 &#8594; 3.5-lite on a 503</text>
  <text class="m" x="130" y="467" fill="#a3b8b5" font-size="12">every step logs which model actually served it</text>
  <text class="m" x="130" y="486" fill="#a3b8b5" font-size="12">gate blocks state-inconsistent writes before they run</text>
  <text class="m" x="130" y="505" fill="#a3b8b5" font-size="12">a worker sees only its own task, never the ticket &#8212;</text>
  <text class="m" x="130" y="524" fill="#a3b8b5" font-size="12">which is what makes each claim independently checkable</text>

  <text class="m" x="130" y="572" fill="#4d6360" font-size="11.5" letter-spacing="1.4">MEASURED, NOT CLAIMED</text>
  <text class="m" x="130" y="596" fill="#a3b8b5" font-size="12">silent-failure rate of our own Gemini fleet, live on the board</text>
  <text class="m" x="130" y="615" fill="#a3b8b5" font-size="12">eval harness injects faults against hidden ground truth,</text>
  <text class="m" x="130" y="634" fill="#a3b8b5" font-size="12">so it scores the verifier as well as the workers</text>

  <!-- legend -->
  <g transform="translate(130, 812)">
    <circle cx="5" cy="-4" r="5" fill="#22d3ee"/><text class="m" x="18" y="0" fill="#7f9694" font-size="11.5">Gemini</text>
    <circle cx="105" cy="-4" r="5" fill="#a78bfa"/><text class="m" x="118" y="0" fill="#7f9694" font-size="11.5">Gemma / learning</text>
    <circle cx="270" cy="-4" r="5" fill="#34d399"/><text class="m" x="283" y="0" fill="#7f9694" font-size="11.5">verification path</text>
    <circle cx="430" cy="-4" r="5" fill="#fbbf24"/><text class="m" x="443" y="0" fill="#7f9694" font-size="11.5">policy gate</text>
    <circle cx="550" cy="-4" r="5" fill="#fb7185"/><text class="m" x="563" y="0" fill="#7f9694" font-size="11.5">silent failure caught</text>
  </g>
  <text class="m" x="1558" y="812" fill="#3d5250" font-size="11.5" text-anchor="end">github.com/rodriguescarson/attest-fleet</text>
</svg>
