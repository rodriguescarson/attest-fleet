[project]
name = "attest-fleet"
version = "0.1.0"
description = "A governed agent fleet on Gemini 3.7 + ADK whose every claim is independently verified"
authors = [
    { name = "Carson Rodrigues", email = "rodriguescarson@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.7.1",
    "google-cloud-firestore>=2.29.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

# The interpretability probe in probe/ is not part of the service. It needs a GPU box and
# a few hundred MB of ML wheels, so it is an opt-in extra: `uv sync --extra probe`.
# Nothing in src/ imports any of these.
[project.optional-dependencies]
probe = [
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.44",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
